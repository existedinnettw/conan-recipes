patches:
  "cci.20251209":
    - patch_file: "patches/0001-build-with-gcc-and-clang.patch"
      patch_description: >-
        Upstream only builds with MSVC on Windows: include the OrbitAnglez*
        headers by their real (lowercase z) names, qualify SparseVector's
        calls into its std::map base with this-> and include <fstream> and
        <limits>, and define DiagonalMatrix's static identity matrices inline
        so every object file using the header no longer defines them.
      patch_type: "portability"
